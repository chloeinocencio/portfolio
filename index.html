<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chloe Inocencio</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #111110;
      --muted: #8a8a86;
      --tile: #f0efec;
      --gutter: 32px;
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #fff;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      padding: 0 var(--gutter);
      max-width: 1440px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    header {
      padding-top: 28px;
      margin-bottom: 56px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--tile);
    }
    .intro { flex: 1; min-width: 0; }
    .top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 2px;
    }
    .name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .links {
      display: flex;
      gap: 18px;
      color: var(--muted);
    }
    .links a { transition: color 0.2s ease; }
    .links a:hover { color: var(--ink); }

    .bio {
      max-width: 34em;
      color: var(--muted);
    }

    /* ── WORK GRID ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 16px;
      row-gap: 72px;
    }

    .project { display: block; }

    /* fade up on open — only when JS is running, so content never stays hidden */
    .js .project {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.9s cubic-bezier(0.2, 0.7, 0.2, 1),
                  transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
      transition-delay: var(--delay, 0ms);
    }
    .js .project.in {
      opacity: 1;
      transform: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .js .project { opacity: 1; transform: none; transition: none; }
    }

    .shot {
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      background: var(--tile);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .shot > * {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .project:hover .shot > * { transform: scale(1.02); }

    /* placeholder tones until real screenshots exist */
    .ph { background: var(--tile); }
    .ph.t2 { background: #ebeae6; }
    .ph.t3 { background: #f3f2ef; }

    .title {
      font-weight: 500;
      margin-bottom: 2px;
    }
    .desc {
      color: var(--muted);
      max-width: 30em;
    }

    /* ── FOOTER ── */
    footer {
      margin-top: 160px;
      padding: 24px 0 28px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── PAGE TRANSITION (matches the project pages) ── */
    #page-cover {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 9999;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.4s ease;
    }
    #page-cover.hidden { opacity: 0; }

    /* ── MOBILE ── */
    @media (max-width: 720px) {
      :root { --gutter: 20px; }
      header { padding-top: 22px; margin-bottom: 40px; gap: 12px; align-items: flex-start; }
      .avatar { width: 40px; height: 40px; }
      .top { gap: 16px; }
      .links { gap: 14px; }
      .grid { grid-template-columns: 1fr; row-gap: 48px; }
      footer { margin-top: 96px; }
    }
  </style>
</head>
<body>
  <div id="page-cover"></div>
  <div class="wrap">
    <header>
      <img class="avatar" src="avatar.jpg" alt="Chloe Inocencio" width="48" height="48" />
      <div class="intro">
      <div class="top">
        <span class="name">CHLOE INOCENCIO</span>
        <nav class="links">
          <a href="https://www.linkedin.com/in/chloe-inocencio" target="_blank" rel="noopener">LinkedIn</a>
          <a href="mailto:chloeinocencio.contact@gmail.com">Email</a>
        </nav>
      </div>
      <p class="bio">
        Half engineer, half designer, entirely user-focused. Let's build together!
      </p>
      </div>
    </header>

    <main class="grid">
      <a class="project" href="wheretwo.html">
        <div class="shot"><div class="ph"></div></div>
        <p class="title">WhereTwo</p>
        <p class="desc">Coming soon.</p>
      </a>
      <a class="project" href="drip.html">
        <div class="shot"><div class="ph t2"></div></div>
        <p class="title">Grind</p>
        <p class="desc">Coming soon.</p>
      </a>
      <a class="project" href="plantr.html">
        <div class="shot"><div class="ph t3"></div></div>
        <p class="title">JadeGarden</p>
        <p class="desc">Coming soon.</p>
      </a>
      <a class="project" href="mindreset.html">
        <div class="shot"><div class="ph"></div></div>
        <p class="title">Gotcha</p>
        <p class="desc">Coming soon.</p>
      </a>
      <a class="project" href="mems.html">
        <div class="shot"><div class="ph t2"></div></div>
        <p class="title">Recap</p>
        <p class="desc">Coming soon.</p>
      </a>
      <a class="project" href="seventyfive.html">
        <div class="shot"><div class="ph t3"></div></div>
        <p class="title">75</p>
        <p class="desc">Coming soon.</p>
      </a>
    </main>

    <footer>
      <span>&copy; 2026 Chloe Inocencio</span>
    </footer>
  </div>

  <script>
    /* page enter / exit fade, same as the project pages */
    (function () {
      var cover = document.getElementById('page-cover');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { cover.classList.add('hidden'); });
      });
      // coming back with the browser's back button: don't stay white
      window.addEventListener('pageshow', function (e) {
        if (e.persisted) cover.classList.add('hidden');
      });
      document.addEventListener('click', function (e) {
        var link = e.target.closest('a[href]');
        if (!link || e.metaKey || e.ctrlKey || e.shiftKey) return;
        var href = link.getAttribute('href');
        if (!href || /^(https?:|mailto:|#)/.test(href)) return;
        e.preventDefault();
        cover.classList.remove('hidden');
        setTimeout(function () { window.location.href = href; }, 420);
      });
    })();

    (function () {
      var projects = document.querySelectorAll('.project');
      if (!('IntersectionObserver' in window)) return;
      document.documentElement.classList.add('js');

      // boxes visible on open fade up one after another;
      // boxes further down fade up as they scroll into view
      var batch = 0, timer;
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          var el = e.target;
          el.style.setProperty('--delay', (batch++ * 110) + 'ms');
          el.classList.add('in');
          io.unobserve(el);
        });
        clearTimeout(timer);
        timer = setTimeout(function () { batch = 0; }, 120);
      }, { threshold: 0.12 });

      projects.forEach(function (p) { io.observe(p); });
    })();
  </script>
</body>
</html>
